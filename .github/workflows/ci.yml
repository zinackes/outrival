name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not the tip: a secret committed and deleted in a
          # later commit is still in the pack every clone gets.
          fetch-depth: 0
      # Supply-chain gates run before install, so a compromised postinstall cannot
      # taint its own scan. Both block the PR (audit D-01): the previous setup was
      # informational only, and its 26 high advisories went unread for months.
      - name: Scan the dependency tree (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan the history for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with: { version: 10.11.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: pnpm install --frozen-lockfile
      # Blocking. The old `|| true` dated from npm retiring /-/npm/v1/security/audits;
      # the endpoint answers again, so a failure here is a real advisory. Silencing one
      # means an entry in pnpm.auditConfig.ignoreGhsas, which needs a dated reason in
      # docs/security/audit-ignores.md first: the list is empty on purpose.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm check:lint
      # The contrast gate. It existed since #518 and nothing ran it, which is how a
      # palette change reintroduced text under 4.5:1 twice (`ux:14`, `ux:59`). No
      # install of its own: it is dependency-free apart from shiki, which apps/web
      # already depends on.
      - run: pnpm check:contrast
      - run: pnpm test
