# /etc/systemd/system/docker.service.d/wait-for-wg.conf
#
# Postgres binds 10.10.0.1:5432, an address that only exists once wg0 is up. If
# docker starts first on a reboot the bind fails and outrival-pg restart-loops —
# a failure that looks like a database problem and is really a boot-order one.
#
# Wants, not Requires: if the tunnel is down, docker must still start. The
# workers reach Postgres over the internal bridge network, so they keep running
# with no tunnel at all — only the API (which comes in over wg0) is affected.
#
# Apply with:
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp docker-wait-for-wg.conf /etc/systemd/system/docker.service.d/
#   sudo systemctl daemon-reload
#
# Verify it took effect (the unit file alone is not proof):
#   systemctl show docker -p After | tr ',' '\n' | grep wg

[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service
