    "description": "&lt;p&gt;Banking hasn&#39;t changed much in decades. We&#39;re changing that. One product at a time.&lt;/p&gt;&lt;p&gt;Lunar is a Nordic challenger bank building the future of financial life with AI at the core. Our engineers, designers, and product people work on problems that actually matter. Making money simpler, smarter, and more rewarding for millions of people across the Nordics.&lt;/p&gt;&lt;p&gt;Fully licensed and founded in 2015, with offices in Copenhagen, Aarhus and Stockholm.&lt;/p&gt;&lt;p&gt;We move fast, we build with purpose, and we&#39;re just getting started.&lt;/p&gt;&lt;p&gt;As our new Sanctions Lead you&#39;ll join the Financial Crime Risk Management team based in Copenhagen or Aarhus, reporting to Camilla Skov, Director of Financial Crime Risk Management, working to keep Lunar and its customers protected through rigorous, legally grounded sanctions expertise.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What will you do?&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Be the regulatory sanction expert in Lunar and lead the regulatory assessments of potential hits against relevant sanctions lists and ensuring outcomes are documented and escalated in line with applicable regulations and internal procedures&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Manage and resolve complex sanctions cases, including jurisdictional analysis, ownership and control assessments under applicable designation criteria, and legal determinations on assets subject to restrictive measures&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Drive the implementation of new sanctions legislation and broader financial crime regulation, contributing to gap analyses, policy updates, and cross-functional coordination to keep Lunar compliant and ahead of changes&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Develop and maintain internal FCP policies, keeping them aligned with current regulatory requirements&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Provide regulatory FCP expert advisory on complex financial crime cases&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Support FCP incident management&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;What are we looking for in you?&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Experience in financial crime compliance or sanctions within a regulated financial institution — fintech, bank, or payment institution background is a strong plus&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Deep knowledge of sanctions frameworks (EU, UN, OFAC) and the regulatory and legal skills to apply them to complex, real-world cases&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Proven ability to drive processes and projects forward, bringing in the right stakeholders at the right time and keeping things moving&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Strong analytical skills — you can pull together information from multiple sources, weigh it objectively, and land on a clear, well-reasoned judgment&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Fluent in English, both written and spoken, with the communication skills to make complex regulatory topics land clearly for a range of audiences&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;A collaborative approach and genuine willingness to share knowledge — you make the people around you sharper&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;What you get (aka. Benefits and perks)&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;4 days in the office. We&#39;re a team that builds together, thinks together, and moves together. Showing up is part of how we work.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;State of the art equipment. The newest computer, monitor, mouse, and keyboard. We want you to do your best work without anything slowing you down.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Pension, health insurance, and enhanced parental leave. From your financial future to your family moments. We&#39;ve got you covered.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Are you ready to join the journey? Apply now and let&#39;s find out more!&lt;/p&gt;&lt;p&gt;While you hold on tight for us to get back to you, curious to see what we&#39;re up to? Follow us on &lt;a target=&quot;_blank&quot; href=&quot;https://www.linkedin.com/company/lunarbank/mycompany/?viewAsMember=true&quot;&gt;LinkedIn&lt;/a&gt; for business announcements and releases 📢, check out our &lt;a target=&quot;_blank&quot; href=&quot;https://www.instagram.com/lifeatlunar/&quot;&gt;Instagram&lt;/a&gt; for an inside scoop on what it&#39;s like to work here.&lt;/p&gt;&lt;p&gt;We welcome applications from candidates of all backgrounds. If you need any adjustments during the recruitment process, please let us know.&lt;/p&gt;&lt;p&gt;Depending on the regulations in the country where you will be employed, we will ask to see or obtain information about your criminal record.&lt;/p&gt;",
